% Todisco, Wu, Bazzi, "Improving NR-V2X Autonomous Mode Through Resource
% Re-Evaluation", IEEE VNC 2024, Table II. Per-run switches (density,
% retransmissions, re-evaluation, DIT) are passed by run_dit_paper.m.

[seed]                  0
[simulationTime]        10
[Technology]            5G-V2X
[mode5G]                1

% Scenario: highway, 3+3 lanes, 70 +- 7 km/h
[TypeOfScenario]        ETSI-Highway
[Nlanes]                3
[roadWidth]             4
[roadLength]            2000
[rho]                   50
[vMean]                 70
[vStDev]                7

% Power and propagation
[BwMHz]                 20
[Ptx_dBm]               23
[Gt_dB]                 3
[Gr_dB]                 3
[F_dB]                  9
[channelModel]          0
[stdDevShadowLOS_dB]    3

% Traffic: 1000 B every 100 ms
[beaconSizeBytes]       1000
[allocationPeriod]      0.1

% NR-V2X access layer
[BRAlgorithm]           18
[SCS_NR]                15
[nDMRS_NR]              24
[MCS_NR]                5
[sizeSubchannel]        10
[sinrThresholdCV2X_LOS] 3.6
[probResKeep]           0
[powerThresholdAutonomous] -126
[T1autonomousMode]      1
[T2autonomousMode]      100
[FixedPdensity]         false
[BRoverlapAllowed]      false
[ifAdjacent]            true
[dcc_active]            false
[cbrActive]             false

% Metrics: PRR every 10 m up to 200 m, wireless blind spot within 150 m.
% Raw = [150 200] is passed on the command line (a space inside a value breaks the cfg parser)
[printPacketReceptionRatio] true
[prrResolution]         10
[printUpdateDelay]      true
[printWirelessBlindSpotProb] true
[delayWBSmax]           10
[delayWBSresolution]    0.1
[printNeighbors]        false
[printPRRmap]           false
[printCBR]              false
